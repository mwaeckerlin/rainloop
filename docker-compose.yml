services:
  snappymail-proxy:
    image: mwaeckerlin/snappymail:nginx
    build:
      context: .
      target: nginx
      dockerfile: Dockerfile.nginx
      args:
        # empty by default → full release-signature verification, same
        # contract as the php-fpm image below
        SKIP_GPG_VERIFY: "${SKIP_GPG_VERIFY:-}"
    ports:
      - 8080:8080
    networks:
      - frontend

  snappymail:
    image: mwaeckerlin/snappymail:php-fpm
    build:
      context: .
      target: php-fpm
      dockerfile: Dockerfile.php-fpm
      args:
        # empty by default → full release-signature verification. Test
        # harnesses (mailservice e2e) export SKIP_GPG_VERIFY=1 before
        # building because they ship the placeholder signing key.
        SKIP_GPG_VERIFY: "${SKIP_GPG_VERIFY:-}"
    volumes:
      # /app/data is the declared data volume of the php-fpm image
      # (see Dockerfile.php-fpm) — the mailservice e2e pins this path
      - type: volume
        source: data
        target: /app/data
    networks:
      - frontend
      - backend

  mysql:
    image: mariadb
    volumes:
      - type: volume
        source: mysql
        target: /var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "snappymail"
      MYSQL_USER: "snappymail"
      MYSQL_PASSWORD: "Ch4ng3-7h1S-Pa5SW0rd"
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  data:
  mysql:
