services:
  snappymail-proxy:
    image: mwaeckerlin/rainloop:nginx
    build:
      context: .
      target: nginx
      dockerfile: Dockerfile.nginx
    ports:
      - "${BIND_ADDRESS:+${BIND_ADDRESS:-}:}8080:8080"
    networks:
      - frontend

  snappymail:
    image: mwaeckerlin/rainloop:php-fpm
    build:
      context: .
      target: php-fpm
      dockerfile: Dockerfile.php-fpm
    volumes:
      - type: volume
        source: data
        target: /app/data
    networks:
      - frontend
      - backend

  # the two images above published once more as mwaeckerlin/rainloop:nginx-1
  # and php-fpm-1, the names of the version line 1; no container is started
  # from these services
  snappymail-proxy-1:
    image: mwaeckerlin/rainloop:nginx-1
    build:
      context: .
      target: nginx
      dockerfile: Dockerfile.nginx
    scale: 0

  snappymail-1:
    image: mwaeckerlin/rainloop:php-fpm-1
    build:
      context: .
      target: php-fpm
      dockerfile: Dockerfile.php-fpm
    scale: 0

  mysql:
    image: mariadb
    volumes:
      - type: volume
        source: mysql
        target: /var/lib/mysql
    environment:
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_DATABASE: "snappymail"
      MYSQL_USER: "snappymail"
      MYSQL_PASSWORD: "Ch4ng3-7h1S-Pa5SW0rd"
    networks:
      - backend

networks:
  frontend:
  backend:

volumes:
  data:
  mysql:
